name: Prism Shader Build

on:
  push:
    paths:
      - ".github/workflows/prism-shaders.yml"
      - "NuGet.Config"
      - "global.json"
      - "Cerneala.Backends.SdlGpu/**"
      - "Drawing/Prism/Shaders/**"
      - "Tools/Cerneala.SdlShaderCompiler/**"
      - "tests/Cerneala.SdlGpuSmoke/**"
      - "tests/Cerneala.Tests.SdlGpu/**"
  pull_request:
    paths:
      - ".github/workflows/prism-shaders.yml"
      - "NuGet.Config"
      - "global.json"
      - "Cerneala.Backends.SdlGpu/**"
      - "Drawing/Prism/Shaders/**"
      - "Tools/Cerneala.SdlShaderCompiler/**"
      - "tests/Cerneala.SdlGpuSmoke/**"
      - "tests/Cerneala.Tests.SdlGpu/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdlgpu:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore .\Cerneala.slnx

      - name: Clean shader build
        run: |
          dotnet clean .\Cerneala.Backends.SdlGpu\Cerneala.Backends.SdlGpu.csproj -c Release --no-restore
          dotnet build .\Cerneala.Backends.SdlGpu\Cerneala.Backends.SdlGpu.csproj -c Release --no-restore
          dotnet run --project .\Tools\Cerneala.SdlShaderCompiler\Cerneala.SdlShaderCompiler.csproj -c Release -- --verify

      - name: Verify embedded shader contract
        run: dotnet test .\tests\Cerneala.Tests.SdlGpu\Cerneala.Tests.SdlGpu.csproj -c Release --no-restore

      - name: Verify SDL_GPU Prism rendering
        run: dotnet run --project .\tests\Cerneala.SdlGpuSmoke\Cerneala.SdlGpuSmoke.csproj -c Release --no-restore -- --mode prism --artifacts artifacts/ci/smoke/prism
