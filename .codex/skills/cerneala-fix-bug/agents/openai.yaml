interface:
  display_name: "CernealaFixBug"
  short_description: "Reproduce, test and fix Cerneala bugs"
  default_prompt: "Use $cerneala-fix-bug in a temporary worktree to reproduce this Cerneala bug with CSI or a Servo-driven runtime scenario, inspect it through Detective, repair any confirmed Servo or Detective defect encountered without stopping for separate permission, add only justified permanent Detective diagnostics when observability is missing, create a RED regression test, implement the smallest correct fix, verify it with focused tests only (never the complete suite), build a before app and an after app that let me check the fix, then commit, push, and open the pull request with $git-session-commit-push and give me the user-validation steps."
